name: Deploy Frontend to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - next.config.*
      - tsconfig*.json
      - tailwind.config.*
      - postcss.config.*
      - Dockerfile
      - .dockerignore
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - .github/actions/docker-build/**

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --passWithNoTests --watchAll=false --coverage=false --testPathIgnorePatterns="e2e" --maxWorkers=2

  build:
    name: Build Frontend for Production
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and push Frontend Docker image
        uses: ./.github/actions/docker-build
        with:
          working-directory: .
          image-tag: prod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # No --build-arg needed: public env vars (CIVITAS_API_URL, MAPBOX_ACCESS_TOKEN,
          # etc.) are injected at container startup via scripts/docker-entrypoint.sh,
          # which reads them from the pod's process environment (Infisical).
          # A single image serves all environments without rebuild.
