apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: base-chart
    repo: oci://ghcr.io/prefeitura-rio/charts
    version: 2.4.2
    releaseName: civitas-app
    namespace: civitas
    valuesInline:
      fullnameOverride: "civitas-app"

      image:
        repository: ghcr.io/prefeitura-rio/civitas-app
        tag: staging
        pullPolicy: Always

      securityContext:
        runAsUser: 1000

      healthCheck:
        path: ""

      startupProbe:
        httpGet:
          path: /api/health
          port: 8080
        failureThreshold: 18
        periodSeconds: 10
        timeoutSeconds: 5

      livenessProbe:
        httpGet:
          path: /api/health
          port: 8080
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5

      readinessProbe:
        httpGet:
          path: /api/health
          port: 8080
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5

      service:
        port: 80
        containerPort: 8080

      resources:
        requests:
          cpu: "250m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"

      istio:
        enabled: true
        sidecar:
          proxyMemory: "256Mi"
          proxyMemoryLimit: "512Mi"
        virtualService:
          hosts:
            - "app.staging.civitas.rio"
          # proxy-buffer-size e proxy-buffers-number (nginx) não têm equivalente direto
          # no base-chart/Istio; o Envoy usa 60KB de limite para headers por padrão,
          # que cobre o uso do civitas-app. Adicionar EnvoyFilter customizado se
          # aparecerem erros 431 (Request Header Fields Too Large).
          timeout: 600s # TODO: reduzir após implementar async tasks no futuro

      infisicalSecret:
        enabled: true
        secretName: "civitas-app" # pragma: allowlist secret
        projectSlug: "civitas-app-9-a-ex"
        envSlug: "staging"
        secretsPath: "/"
        recursive: true
        creationPolicy: "Orphan"

      podDisruptionBudget:
        enabled: false

      autoscaling:
        enabled: false

      argoImageUpdater:
        enabled: true
        updateStrategy: "digest"
